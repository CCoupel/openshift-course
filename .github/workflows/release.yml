name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Le tag fait foi pour la version (verification, jamais d'ecriture)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tag non SemVer: $GITHUB_REF_NAME"; exit 1; }
          [ "$(cat VERSION)" = "$VERSION" ] || { echo "VERSION ($(cat VERSION)) != tag ($VERSION)"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          awk -v v="$VERSION" 'index($0, "## [" v "]")==1 {f=1; next} f && /^## / {exit} f && !/^---$/' CHANGELOG.md > notes.md 2>/dev/null || true
          [ -s notes.md ] || { echo "CHANGELOG.md ne contient pas d'entrée pour $VERSION"; exit 1; }
      - run: node --check assets/engine.js
      - run: node --check assets/plan.js
      - run: node --check assets/i18n.js
      - name: Validation stricte i18n (module en manquant ou empreinte perimee = echec)
        run: node tools/validate.js --strict-i18n
      - name: Export PowerPoint fr et en (dependances de dev, scripts d'installation desactives)
        run: |
          npm ci --ignore-scripts
          node tools/export-pptx.js --strict-i18n
          node tools/check-pptx.js --strict-i18n
          for L in fr en; do
            test -s "dist/openshift-course-${VERSION}-${L}.pptx" || { echo "pptx ${L} absent"; exit 1; }
            (cd dist && sha256sum "openshift-course-${VERSION}-${L}.pptx" > "openshift-course-${VERSION}-${L}.pptx.sha256")
          done
      - name: Livrable (archive du cours + somme de controle)
        run: |
          zip -r "openshift-course-${VERSION}.zip" index.html assets modules VERSION   # modules/ contient fr/ et en/
          sha256sum "openshift-course-${VERSION}.zip" > "openshift-course-${VERSION}.zip.sha256"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=(--notes-file notes.md)
          PRE=()
          case "$VERSION" in 0.*|*-*) PRE=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "openshift-course-${VERSION}.zip" "openshift-course-${VERSION}.zip.sha256" "dist/openshift-course-${VERSION}-fr.pptx" "dist/openshift-course-${VERSION}-fr.pptx.sha256" "dist/openshift-course-${VERSION}-en.pptx" "dist/openshift-course-${VERSION}-en.pptx.sha256" --title "v${VERSION}" "${NOTES[@]}" "${PRE[@]}"
  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
