name: CI
on:
  push:
    branches: ['feature/**', 'bugfix/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - run: node --check assets/engine.js
      - run: node --check assets/plan.js
      - run: node tools/validate.js
