name: Pages
on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'modules/**'
      - 'index.html'
      - 'tools/validate.js'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - run: node --check assets/engine.js
      - run: node --check assets/plan.js
      - run: node tools/validate.js
      - name: Artefact (uniquement le cours HTML)
        run: |
          mkdir _site
          cp -r index.html assets modules _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
